name: "SAST scan, build & push image, vulnerability scan, deploy via GitOps"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  sast_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis relevance

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests with coverage
        run: npm test

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build_and_push_image:
    runs-on: ubuntu-latest
    needs: sast_scan
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set image tag from commit SHA
        id: version
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/supermariogitopsproject:${{ steps.version.outputs.version }} .
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/supermariogitopsproject:${{ steps.version.outputs.version }}

  scan_image:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    env:
      VERSION: ${{ needs.build_and_push_image.outputs.version }}
    steps:
      - name: Run Trivy vulnerability scanner on Docker Hub image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/supermariogitopsproject:${{ env.VERSION }}
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  update_deploy_branch:
    runs-on: ubuntu-latest
    needs: [build_and_push_image, scan_image]
    env:
      VERSION: ${{ needs.build_and_push_image.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Git Config
        run: |
          git config --global user.email "${{ secrets.GIT_EMAIL }}"
          git config --global user.name "${{ secrets.GIT_USERNAME }}"

      - name: Update k8s manifest on deploy branch
        run: |
          git fetch origin deploy || true
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git checkout -B deploy origin/deploy
          else
            git checkout -B deploy origin/main
          fi
          sed -i "s|image: .*supermariogitopsproject:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/supermariogitopsproject:${{ env.VERSION }}|" k8s/deployment.yaml
          git add k8s/deployment.yaml
          git commit -m "Deploy image tag ${{ env.VERSION }} [skip ci]"
          git push origin HEAD:deploy
